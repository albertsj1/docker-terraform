name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write

    steps:
      - name: Get Latest TF Version
        run: |
          TF_VERSION=$(curl -s https://api.github.com/repos/hashicorp/terraform/releases/latest | jq -r .tag_name | tr -d 'v')
          echo "TF_VERSION=$TF_VERSION" >> $GITHUB_ENV
        shell: bash
        
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: albertsj1/terraform
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # set branch tag for default branch
            type=raw,value={{github.ref}},enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{env.TF_VERSION}}

      - name: Build and push Docker image (multi-platform)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
          build-args: |
            TF_VERSION=${{ env.TF_VERSION }}

      - name: Attest
        uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-name: index.docker.io/albertsj1/terraform
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          